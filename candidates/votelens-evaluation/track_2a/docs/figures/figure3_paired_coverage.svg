<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Valid-output coverage versus strict correctness (54 paired cases)</title>
  <desc id="desc">Two-point scatter: dense-v1 at coverage 0.796 and strict accuracy 0.593; vote-aware-v1 at coverage 0.463 and strict accuracy 0.426. Denominator 54 for both axes. No frontier or direction is implied; the gate was not calibrated.</desc>
  <rect width="520" height="360" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
    .axis { stroke: #34495e; stroke-width: 1.5; fill: none; }
    .tick { stroke: #8c99a5; stroke-width: 1; }
    .grid { stroke: #e8ecf0; stroke-width: 0.5; }
    .small { font-size: 11px; fill: #4a5568; }
    .lbl { font-size: 12px; }
    .pt { font-size: 13px; font-weight: 600; }
  </style>
  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="600">Coverage and strict correctness (n = 54, one model)</text>
  <text x="260" y="40" text-anchor="middle" class="small">Apertus v1.5 70B; shared denominator; not a risk-coverage frontier</text>

  <!-- Plot area: x from 80 to 460, y from 60 to 280 -->
  <!-- x-axis: coverage 0-1, y-axis: strict accuracy 0-1 -->
  <!-- Plot area width=380, height=220 -->
  <!-- Point definitions: dense x=0.796 y=0.593, vote-aware x=0.463 y=0.426 -->
  <!-- x scale: 80 + 380*val, y scale: 280 - 220*val -->

  <!-- Grid lines at 0.25/0.50/0.75 on both axes, exact scale transform -->
  <g class="grid">
    <line x1="80" y1="225" x2="460" y2="225"/>
    <line x1="80" y1="170" x2="460" y2="170"/>
    <line x1="80" y1="115" x2="460" y2="115"/>
    <line x1="175" y1="60" x2="175" y2="280"/>
    <line x1="270" y1="60" x2="270" y2="280"/>
    <line x1="365" y1="60" x2="365" y2="280"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="280" x2="460" y2="280" class="axis"/>
  <line x1="80" y1="60" x2="80" y2="280" class="axis"/>

  <!-- Axis labels -->
  <text x="270" y="310" text-anchor="middle" font-size="12">Valid-output coverage (denominator = 54)</text>
  <text x="30" y="170" text-anchor="middle" font-size="12" transform="rotate(-90 30 170)">Strict correctness (denominator = 54)</text>

  <!-- Tick marks and labels: x ticks at 80/175/270/365/460 (x = 80 + 380*coverage) -->
  <g class="tick">
    <line x1="175" y1="280" x2="175" y2="284"/>
    <line x1="270" y1="280" x2="270" y2="284"/>
    <line x1="365" y1="280" x2="365" y2="284"/>
    <line x1="460" y1="280" x2="460" y2="284"/>
  </g>
  <g class="small" text-anchor="middle">
    <text x="80" y="296">0.00</text>
    <text x="175" y="296">0.25</text>
    <text x="270" y="296">0.50</text>
    <text x="365" y="296">0.75</text>
    <text x="460" y="296">1.00</text>
  </g>
  <g class="small" text-anchor="end">
    <text x="72" y="284">0</text>
    <text x="72" y="174">0.50</text>
    <text x="72" y="64">1.00</text>
  </g>

  <!-- Dense-v1 point: x=0.796 -> 383, y=0.593 -> 150 -->
  <circle cx="383" cy="150" r="7" fill="#3c8d5a" opacity="0.85"/>
  <text x="383" y="136" text-anchor="middle" class="pt" fill="#3c8d5a">Dense-v1</text>
  <text x="383" y="165" text-anchor="middle" class="small">Coverage 43/54</text>
  <text x="383" y="178" text-anchor="middle" class="small">Strict 32/54</text>

  <!-- Vote-aware-v1 point: x=0.463 -> 256, y=0.426 -> 186 -->
  <circle cx="256" cy="186" r="7" fill="#c9534f" opacity="0.85"/>
  <text x="256" y="172" text-anchor="middle" class="pt" fill="#c9534f">Vote-aware-v1</text>
  <text x="256" y="201" text-anchor="middle" class="small">Coverage 25/54</text>
  <text x="256" y="214" text-anchor="middle" class="small">Strict 23/54</text>

  <!-- Note: the two points are plotted as observations only. No connecting
       direction is drawn: the identity/citation gate was not calibrated, so
       this is not a risk-coverage frontier and no improvement path is implied. -->
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#888">Only two genuinely comparable points (same model, same denominator, same task); not a calibrated frontier.</text>
</svg>