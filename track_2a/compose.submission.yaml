# Submission runtime. Historical experiments use compose.yaml.
services:
  app:
    build: .
    image: hackapertus:local
    working_dir: /app/src
    command: ["python3", "booklet_app.py"]
    environment:
      LLM_NAME: ${LLM_NAME:-swiss-ai/Apertus-v1.5-70B}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.inference.cscs.ch/v1}
      LLM_API_KEY: ${LLM_API_KEY:-${CSCS_INFERENCE_API_KEY:-}}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-32768}
      # Hosted OpenAI-compatible endpoints need not expose vLLM's /tokenize.
      # The optional path still requires exact reported usage and finish_reason=stop.
      LLM_TOKEN_PREFLIGHT: ${LLM_TOKEN_PREFLIGHT:-optional}
      SUBMISSION_MODEL_REQUIRED: "1"
      RESULT_FILE: ${RESULT_FILE:-}
      DIAGNOSTICS_FILE: ${DIAGNOSTICS_FILE:-}
      REQUEST_FILE: ${REQUEST_FILE:-/app/data/request.json}
    volumes:
      - ./data:/app/data
      - hf-cache:/home/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hf-cache:
