# Submission runtime. Historical experiments use compose.yaml.
services:
  app:
    build: .
    image: hackapertus:local
    working_dir: /app/src
    command: ["python3", "booklet_app.py"]
    environment:
      LLM_NAME: ${LLM_NAME:-swiss-ai/Apertus-v1.5-8B}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://apertus:8000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-32768}
      LLM_TOKEN_PREFLIGHT: required
      SUBMISSION_MODEL_REQUIRED: "1"
      RESULT_FILE: ${RESULT_FILE:-}
      REQUEST_FILE: ${REQUEST_FILE:-/app/data/request.json}
    volumes:
      - ./data:/app/data
      - hf-cache:/home/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hf-cache:
