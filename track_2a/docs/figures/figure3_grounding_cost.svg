<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Citation verification and prompt-token cost by retrieval method</title>
  <desc id="desc">Two panels compare verified citation rate and mean prompt tokens per case for methods A, B and C on 81 cases.</desc>
  <rect width="820" height="430" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
    .a { fill: #355f8d; } .b { fill: #2a9d8f; } .c { fill: #b56576; }
    .axis { stroke: #34495e; stroke-width: 1.5; } .grid { stroke: #d9e0e6; stroke-width: 1; }
    .small { font-size: 12px; } .label { font-size: 14px; } .value { font-size: 13px; font-weight: 600; }
  </style>
  <text x="410" y="27" text-anchor="middle" font-size="18" font-weight="600">Experimental retrieval increased prompt cost without better citation verification</text>
  <text x="410" y="47" text-anchor="middle" class="small">n = 81 per method; token counts are reported API usage</text>
  <text x="220" y="78" text-anchor="middle" class="label" font-weight="600">Verified citations (%)</text>
  <text x="615" y="78" text-anchor="middle" class="label" font-weight="600">Mean prompt tokens per case</text>
  <line x1="70" y1="320" x2="370" y2="320" class="axis"/><line x1="70" y1="95" x2="70" y2="320" class="axis"/>
  <line x1="465" y1="320" x2="765" y2="320" class="axis"/><line x1="465" y1="95" x2="465" y2="320" class="axis"/>
  <g class="grid">
    <line x1="70" y1="245" x2="370" y2="245"/><line x1="70" y1="170" x2="370" y2="170"/><line x1="70" y1="95" x2="370" y2="95"/>
    <line x1="465" y1="255.7" x2="765" y2="255.7"/><line x1="465" y1="191.4" x2="765" y2="191.4"/><line x1="465" y1="127.1" x2="765" y2="127.1"/>
  </g>
  <g class="small" text-anchor="end">
    <text x="62" y="324">0</text><text x="62" y="249">20</text><text x="62" y="174">40</text><text x="62" y="99">60</text>
    <text x="457" y="324">0</text><text x="457" y="260">400</text><text x="457" y="196">800</text><text x="457" y="132">1,200</text>
  </g>
  <rect x="105" y="125.6" width="58" height="194.4" class="a"/><rect x="191" y="134.8" width="58" height="185.2" class="b"/><rect x="277" y="153.3" width="58" height="166.7" class="c"/>
  <rect x="500" y="124.8" width="58" height="195.2" class="a"/><rect x="586" y="106.9" width="58" height="213.1" class="b"/><rect x="672" y="108.8" width="58" height="211.2" class="c"/>
  <g class="value" text-anchor="middle">
    <text x="134" y="117">51.9</text><text x="220" y="126">49.4</text><text x="306" y="145">44.4</text>
    <text x="529" y="117">1,215</text><text x="615" y="99">1,326</text><text x="701" y="101">1,314</text>
  </g>
  <g class="label" text-anchor="middle">
    <text x="134" y="344">A</text><text x="220" y="344">B</text><text x="306" y="344">C</text>
    <text x="529" y="344">A</text><text x="615" y="344">B</text><text x="701" y="344">C</text>
  </g>
  <rect x="275" y="383" width="14" height="14" class="a"/><text x="295" y="395" class="small">A · SwissBERT</text>
  <rect x="417" y="383" width="14" height="14" class="b"/><text x="437" y="395" class="small">B · Hybrid RRF</text>
  <rect x="555" y="383" width="14" height="14" class="c"/><text x="575" y="395" class="small">C · Proposition rerank</text>
</svg>
